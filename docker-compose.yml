services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bugdiag
      POSTGRES_USER: bugdiag
      POSTGRES_PASSWORD: bugdiag
    ports:
      - "5432:5432"
    volumes:
      - bugdiag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugdiag -d bugdiag"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bugdiag_pgdata:
